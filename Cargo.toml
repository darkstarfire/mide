[package]
name = "mide"
version = "0.10.6"
edition = "2024"
default-run = "mide"

# O compositor fica em src/compositor/ (a biblioteca e os apps, no resto de src/).
[[bin]]
name = "mide"
path = "src/compositor/main.rs"

[dependencies]
# O framework de apps nativos (janelas, componentes no visual do Tahoe), projeto à
# parte: github.com/fabioaacarneiro/mide-ui. Para mexer nele junto com o mide, veja
# "Desenvolver o mide-ui junto" no ANNOTATIONS_OF_AGENT.md.
mide-ui = { git = "https://github.com/fabioaacarneiro/mide-ui", branch = "main" }
chrono = "0.4"
cosmic-text = "0.19"
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
# Sinais no mide-sudo (desfazer a liberação da tela X11 ao ser encerrado).
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
resvg = { version = "0.45", default-features = false }
rustix = { version = "1", features = ["pty", "process", "termios", "fs", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
# Mensagens JSON do cliente LSP do mide-code (o cliente é do mide; o serde_json só lê e escreve o JSON).
serde_json = "1"
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "renderer_gl", "backend_egl", "backend_winit", "backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev"] }
smithay-client-toolkit = "0.21"
tiny-skia = { version = "0.12", features = ["std"] }
toml = "1.1.8"
# Código dos protocolos que não vêm no Smithay (protocols/*.xml): gtk-shell e o menu do KDE.
wayland-scanner = "0.31"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
usvg = { version = "0.45", default-features = false }
# Tema de cursores do sistema, desenhado pelo próprio mide no backend DRM.
xcursor = "0.3"
xkbcommon = "0.8"
zbus = "5"
# Compactar e extrair .zip no Arquivos, sem programa externo.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Compactar o conteúdo do PDF do Editor de Texto (já vem com o zip).
flate2 = "1"

# Em desenvolvimento, as dependências (desenho de SVG, imagens, texto, shaders)
# são compiladas otimizadas: sem isso, abrir o launcher ou a dock leva segundos.
# O código do mide continua compilando rápido, sem otimização.
[profile.dev.package."*"]
opt-level = 2

# O próprio mide otimizado também em desenvolvimento: os laços de desenho da barra,
# da dock e do launcher (telas inteiras, pixel a pixel) ficam muito mais rápidos.
[profile.dev]
opt-level = 2
