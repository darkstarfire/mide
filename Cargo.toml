[package]
name = "mide"
version = "0.10.72"
edition = "2024"
default-run = "mide"

# O compositor fica em src/compositor/ (a biblioteca e os apps, no resto de src/).
[[bin]]
name = "mide"
path = "src/compositor/main.rs"

[[bin]]
name = "mide-about"
path = "src/bin/mide-about.rs"

[[bin]]
name = "mide-askpass"
path = "src/bin/mide-askpass.rs"

[[bin]]
name = "mide-bar"
path = "src/bin/mide-bar.rs"

[[bin]]
name = "mide-chooser"
path = "src/bin/mide-chooser.rs"

[[bin]]
name = "mide-ctl"
path = "src/bin/mide-ctl.rs"

[[bin]]
name = "mide-desktop"
path = "src/bin/mide-desktop.rs"

[[bin]]
name = "mide-dock"
path = "src/bin/mide-dock.rs"

[[bin]]
name = "mide-files"
path = "src/bin/mide-files.rs"

[[bin]]
name = "mide-install"
path = "src/bin/mide-install.rs"

[[bin]]
name = "mide-keyboard"
path = "src/bin/mide-keyboard.rs"

[[bin]]
name = "mide-launcher"
path = "src/bin/mide-launcher.rs"

[[bin]]
name = "mide-lock"
path = "src/bin/mide-lock.rs"

[[bin]]
name = "mide-logs"
path = "src/bin/mide-logs.rs"

[[bin]]
name = "mide-new"
path = "src/bin/mide-new.rs"

[[bin]]
name = "mide-notifications"
path = "src/bin/mide-notifications.rs"

[[bin]]
name = "mide-player"
path = "src/bin/mide-player.rs"

[[bin]]
name = "mide-polkit-agent"
path = "src/bin/mide-polkit-agent.rs"

[[bin]]
name = "mide-portal"
path = "src/bin/mide-portal.rs"

[[bin]]
name = "mide-screencast-picker"
path = "src/bin/mide-screencast-picker.rs"

[[bin]]
name = "mide-screenshot"
path = "src/bin/mide-screenshot.rs"

[[bin]]
name = "mide-search"
path = "src/bin/mide-search.rs"

[[bin]]
name = "mide-settings"
path = "src/bin/mide-settings.rs"

[[bin]]
name = "mide-sudo"
path = "src/bin/mide-sudo.rs"

[[bin]]
name = "mide-terminal"
path = "src/bin/mide-terminal.rs"

[[bin]]
name = "mide-calculator"
path = "src/bin/mide-calculator/main.rs"

[[bin]]
name = "mide-code"
path = "src/bin/mide-code/main.rs"

[[bin]]
name = "mide-login"
path = "src/bin/mide-login/main.rs"

[[bin]]
name = "mide-screenshot-editor"
path = "src/bin/mide-screenshot-editor/main.rs"

[[bin]]
name = "mide-writer"
path = "src/bin/mide-writer/main.rs"

[dependencies]
# O framework de apps nativos (janelas, componentes no visual do Tahoe), projeto à
# parte. Fork usado pelo port X11: github.com/darkstarfire/mide-ui, branch port-x11,
# fixado no commit (rev) para o build ser reproduzível. Ao subir um commit novo no
# fork, troque o rev aqui e rode `cargo update -p mide-ui`.
mide-ui = { git = "https://github.com/darkstarfire/mide-ui", rev = "2db473bc8b4465bf67607990200b566f19a125c8" }
chrono = "0.4"
cosmic-text = "0.19"
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
# Sinais no mide-sudo (desfazer a liberação da tela X11 ao ser encerrado).
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
resvg = { version = "0.45", default-features = false }
rustix = { version = "1", features = ["pty", "process", "termios", "fs", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
# Mensagens JSON do cliente LSP do mide-code (o cliente é do mide; o serde_json só lê e escreve o JSON).
serde_json = { version = "1", features = ["preserve_order"] }
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "renderer_gl", "backend_egl", "backend_winit", "backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev"] }
smithay-client-toolkit = "0.21"
tiny-skia = { version = "0.12", features = ["std"] }
toml = "1.1.8"
# Código dos protocolos que não vêm no Smithay (protocols/*.xml): gtk-shell e o menu do KDE.
wayland-scanner = "0.31"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
usvg = { version = "0.45", default-features = false }
# Tema de cursores do sistema, desenhado pelo próprio mide no backend DRM.
xcursor = "0.3"
xkbcommon = "0.8"
# Ler as propriedades de menu das janelas X11 (menu global dos apps pelo XWayland);
# já vem com o winit, sem código C.
x11rb = "0.13"
# OpenGL sobre X11 para renderizacao no backend X11.
glow = "0.12"
# Handle de janela X11 para criar contexto OpenGL.
raw-window-handle = "0.5"
zbus = "5"
# Compactar e extrair .zip no Arquivos, sem programa externo.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Senha de um usuário novo (Configurações → Usuários e grupos): o AccountsService pede o
# hash crypt ($6$, SHA-512). Sem o recurso "simple": o sal vem do /dev/urandom.
sha-crypt = { version = "0.5", default-features = false }
# Compactar o conteúdo do PDF do Editor de Texto (já vem com o zip).
flate2 = "1"
tree-sitter = { version = "0.25", features = ["wasm"] }
wasmtime = { version = "29.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = "29.0.1"
anyhow = "1.0.104"

# Em desenvolvimento, as dependências (desenho de SVG, imagens, texto, shaders)
# são compiladas otimizadas: sem isso, abrir o launcher ou a dock leva segundos.
# O código do mide continua compilando rápido, sem otimização.
[profile.dev.package."*"]
opt-level = 2

# O próprio mide otimizado também em desenvolvimento: os laços de desenho da barra,
# da dock e do launcher (telas inteiras, pixel a pixel) ficam muito mais rápidos.
[profile.dev]
opt-level = 2
