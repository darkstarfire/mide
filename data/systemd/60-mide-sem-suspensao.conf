# O mide não suspende o computador sozinho: a tampa fechada, o botão de ligar e a
# tecla de suspender não mandam dormir (o botão de ligar pergunta no próprio mide).
# Instalado por data/mide-sem-suspensao (sudo). Para suspender, use o menu do mide.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandlePowerKey=ignore
HandleSuspendKey=ignore
