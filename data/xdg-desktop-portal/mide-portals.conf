# Portais do desktop na sessão do mide (XDG_CURRENT_DESKTOP=mide): as implementações do
# GTK. Sem este arquivo, o xdg-desktop-portal não sabe qual usar no "mide" e os apps
# ficam sem as configurações do sistema (o GTK4 mostra só o botão de fechar e ignora o
# tema escuro, as fontes e o tamanho do cursor).
[preferred]
default=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
