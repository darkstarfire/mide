set default=0
set timeout=10

insmod all_video
insmod gfxterm
insmod png
insmod jpeg
set gfxmode=1920x1080,1366x768,auto
set gfxpayload=keep
terminal_output gfxterm

loadfont /boot/grub/themes/mios/noto-sans-14.pf2
loadfont /boot/grub/themes/mios/noto-sans-16.pf2
loadfont /boot/grub/themes/mios/noto-sans-18.pf2
loadfont /boot/grub/themes/mios/noto-sans-bold-18.pf2

source /boot/grub/theme.cfg
