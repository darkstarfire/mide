source /boot/grub/config.cfg

menuentry "mios" --hotkey=m {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "mios (Português do Brasil)" --hotkey=p {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=pt_BR.UTF-8 keyboard-layouts=br timezone=America/Sao_Paulo
	initrd	@INITRD_LIVE@
}

menuentry "mios (safe graphics)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI Firmware Settings" --hotkey=f {
		fwsetup
	}
fi
