# Gera a ISO do mios (Debian 13 por baixo, com o mide) e os pacotes .deb, e publica a ISO:
#   - a cada versão (tags v*): na release "iso", sempre o mesmo endereço de download
#     (https://github.com/fabioaacarneiro/mide/releases/download/iso/mios-<versão>-amd64.iso),
#     com o arquivo trocado pelo novo;
#   - nas tags mios-* (marcos do mios): numa release própria, que fica;
#   - à mão (Actions → mios ISO → Run workflow): só como artefato, ou também na release
#     "iso" com a opção "publish".
name: mios ISO

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the ISO on the \"iso\" release"
        type: boolean
        default: false
  push:
    tags: ["v*", "mios-*"]

permissions:
  contents: write

# Uma versão nova torna a ISO da anterior inútil: a montagem antiga é cancelada.
concurrency:
  group: mios-iso
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # O runner vem com ~14 GB livres: tira o que não usamos (SDKs de outras linguagens).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Cache (cargo and Debian packages)
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo
            target/release
            target/iso/work/cache
          key: mios-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'iso/live/config/package-lists/*') }}
          restore-keys: mios-${{ runner.os }}-

      - name: Build packages and ISO (Debian 13 container)
        run: |
          mkdir -p .ci-cache/cargo
          # Os pacotes da ISO levam sempre o commit na versão, também nas tags: o
          # workflow do apt publica a mesma versão ao mesmo tempo, e com o número igual o
          # apt da montagem trocava o pacote do commit pelo da internet ("downgrade").
          docker run --rm --privileged \
            -e MIDE_VERSION_SUFFIX="+git${GITHUB_SHA::7}" \
            -v "$PWD:/src" -w /src \
            -v "$PWD/.ci-cache/cargo:/root/.cargo" \
            debian:trixie iso/ci.sh
          sudo chown -R "$(id -u):$(id -g)" target .ci-cache
          ls -la target/iso/*.iso

      - name: Upload ISO (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mios-iso
          path: |
            target/iso/mios-*.iso
            target/iso/mios-*.iso.sha256
          compression-level: 0
          retention-days: 14

      - name: Upload packages (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mios-debs
          path: target/deb/*.deb
          retention-days: 14

      - name: Publish the ISO on the releases
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: iso/publish-release.sh
